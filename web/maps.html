<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maps · Lantern</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  #wrap { position: relative; flex: 1 1 auto; min-height: 400px; }
  #map { position: absolute; inset: 0; }
  .float { position: absolute; top: 14px; left: 14px; right: 60px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 2; max-width: 640px; }
  .float input, .float select { background: #fff; color: #1C1F23; border: none; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #hits { position: absolute; top: 72px; left: 14px; z-index: 2; width: min(420px, calc(100% - 28px)); max-height: 50vh; overflow: auto;
    background: #fff; color: #1C1F23; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.3); }
  #hits button { display: block; width: 100%; text-align: left; border: none; border-bottom: 1px solid #E3E0D8; background: #fff;
    color: #1C1F23; padding: 12px 14px; min-height: 44px; cursor: pointer; }
  #hits button:hover { background: #F4F2EC; }
  #hits small { color: #5A626C; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F5B947" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M12 3v2"/><path d="M8 7h8l1 3v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-8z"/><path d="M12 12c1.2 1 1.2 3 0 4c-1.2-1-1.2-3 0-4z"/></svg>
    <span><b>Lantern</b><small>Offline knowledge drive</small></span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="/" data-id="home">Home</a>
    <a href="/maps.html" data-id="maps">Maps</a>
    <a href="/relay.html" data-id="relay">Relay</a>
    <a href="/downloads.html" data-id="downloads">Downloads</a>
  </nav>
  <span class="pill"><span class="dot"></span>Offline maps · © OpenStreetMap contributors</span>
</header>

<div id="wrap">
  <div id="map"></div>
  <div class="float hidden" id="controls">
    <label for="which" class="hidden">Map</label>
    <select id="which" style="flex:0 1 220px"></select>
    <label for="find" class="hidden">Find a place</label>
    <input id="find" type="search" placeholder="Find a town, street or place on screen…" style="flex:1 1 240px" autocomplete="off">
  </div>
  <div id="hits" class="hidden"></div>
  <div id="empty" class="hidden">
    <div class="card" style="max-width:520px">
      <h1 style="font-size:26px" id="emptyTitle">No maps on this drive yet</h1>
      <p class="muted" id="emptyText">Open Downloads and pick an area. Oklahoma at street level is a good start.</p>
      <a class="btn" href="/downloads.html#maps">Open Downloads</a>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/pmtiles.js"></script>
<script src="lib/basemaps.js"></script>
<script>
Lantern.markNav('maps');
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);
let map = null;

function styleFor(fileUrl) {
  const origin = location.origin;
  return {
    version: 8,
    glyphs: origin + '/maps-assets/fonts/{fontstack}/{range}.pbf',
    sprite: origin + '/maps-assets/sprites/v4/light',
    sources: {
      protomaps: { type: 'vector', url: 'pmtiles://' + fileUrl,
        attribution: '<a href="https://openstreetmap.org/copyright">© OpenStreetMap contributors</a>' },
    },
    layers: basemaps.layers('protomaps', basemaps.namedFlavor('light'), { lang: 'en' }),
  };
}

async function show(file) {
  const fileUrl = location.origin + '/maps-data/' + encodeURIComponent(file);
  const archive = new pmtiles.PMTiles(fileUrl);
  protocol.add(archive);
  const h = await archive.getHeader();
  const bounds = [[h.minLon, h.minLat], [h.maxLon, h.maxLat]];
  if (!map) {
    map = new maplibregl.Map({ container: 'map', style: styleFor(fileUrl), bounds, maxZoom: 19, attributionControl: { compact: true } });
    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }), 'bottom-left');
  } else {
    map.setStyle(styleFor(fileUrl));
    map.fitBounds(bounds, { duration: 0 });
  }
  map.setMaxBounds([[h.minLon - 1, h.minLat - 1], [h.maxLon + 1, h.maxLat + 1]]);
}

// Searches place, street and point-of-interest names in the tiles currently loaded.
function findPlaces(q) {
  const hits = document.getElementById('hits');
  q = q.trim().toLowerCase();
  if (!map || q.length < 2) { hits.classList.add('hidden'); return; }
  const seen = new Map();
  for (const layer of ['places', 'pois', 'roads']) {
    let feats = [];
    try { feats = map.querySourceFeatures('protomaps', { sourceLayer: layer }); } catch { continue; }
    for (const f of feats) {
      const name = f.properties['name:en'] || f.properties.name;
      if (!name || !name.toLowerCase().includes(q)) continue;
      const key = layer + '|' + name;
      if (seen.has(key)) continue;
      const g = f.geometry;
      const c = g.type === 'Point' ? g.coordinates : g.type === 'LineString' ? g.coordinates[Math.floor(g.coordinates.length / 2)]
        : g.type === 'MultiLineString' ? g.coordinates[0][0] : null;
      if (!c) continue;
      seen.set(key, { name, kind: f.properties.kind || layer, c, layer });
      if (seen.size >= 30) break;
    }
  }
  const list = [...seen.values()].sort((a, b) => (a.layer === 'places' ? 0 : 1) - (b.layer === 'places' ? 0 : 1));
  hits.innerHTML = list.length ? list.map((h, i) =>
    `<button type="button" data-i="${i}">${Lantern.esc(h.name)} <small>· ${Lantern.esc(String(h.kind).replace(/_/g, ' '))}</small></button>`).join('')
    : '<div style="padding:12px 14px">Nothing by that name in this part of the map. Zoom out or move the map, then search again.</div>';
  hits.classList.remove('hidden');
  hits.querySelectorAll('button').forEach(b => b.onclick = () => {
    const h = list[+b.dataset.i];
    map.flyTo({ center: h.c, zoom: h.layer === 'places' ? 12 : 16 });
    new maplibregl.Marker({ color: '#D9534F' }).setLngLat(h.c).addTo(map);
    hits.classList.add('hidden');
  });
}

async function init() {
  const s = await Lantern.api('/api/status');
  if (!s.maps.length) { document.getElementById('empty').classList.remove('hidden'); return; }
  const sel = document.getElementById('which');
  sel.innerHTML = s.maps.map(m => `<option value="${Lantern.esc(m.file)}">${Lantern.esc(m.name.replace(/-/g, ' '))}</option>`).join('');
  // Prefer the most detailed (largest) map first.
  const first = [...s.maps].sort((a, b) => b.size - a.size)[0];
  sel.value = first.file;
  sel.onchange = () => show(sel.value);
  document.getElementById('controls').classList.remove('hidden');
  let t;
  document.getElementById('find').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => findPlaces(e.target.value), 250); });
  await show(first.file);
}
init().catch(err => {
  document.getElementById('empty').classList.remove('hidden');
  document.getElementById('emptyTitle').textContent = 'This map couldn\'t open';
  document.getElementById('emptyText').textContent = 'The file may be damaged or still downloading. Try downloading it again. (' + err.message + ')';
});
</script>
</body>
</html>
