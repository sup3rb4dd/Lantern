# Builds the CYD firmware (Lantern Deck in deck/, Motion Detector in motion-detector/) and
# publishes the web flashers to GitHub Pages:
#   https://sup3rb4dd.github.io/Lantern/                  Lantern Deck
#   https://sup3rb4dd.github.io/Lantern/motion-detector/  Motion Detector
# Needs Settings › Pages › Source set to "GitHub Actions" (once).
name: CYD web flashers

on:
  push:
    branches: [ main ]
    paths: [ 'deck/**', 'motion-detector/**', '.github/workflows/deck.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('deck/platformio.ini', 'motion-detector/platformio.ini') }}

      - name: Build firmware
        run: |
          pip install -q platformio
          (cd deck && pio run)
          (cd motion-detector && pio run)

      - name: Assemble the flasher site
        run: |
          VERSION=$(grep -oE 'DECK_VERSION=\\"[^\\]+' deck/platformio.ini | sed 's/.*"//')
          mkdir -p site
          cp deck/flasher/* site/
          cp deck/.pio/build/cyd/lantern-deck-cyd.bin site/
          cp deck/.pio/build/cyd-inverted/lantern-deck-cyd-inverted.bin site/
          sed -i "s/__VERSION__/$VERSION/g" site/*.json site/index.html
          MD_VERSION=$(grep -oE 'MD_VERSION=\\"[^\\]+' motion-detector/platformio.ini | sed 's/.*"//')
          mkdir -p site/motion-detector
          cp motion-detector/flasher/* site/motion-detector/
          cp motion-detector/.pio/build/cyd/motion-detector-cyd.bin site/motion-detector/
          cp motion-detector/.pio/build/cyd-inverted/motion-detector-cyd-inverted.bin site/motion-detector/
          sed -i "s/__VERSION__/$MD_VERSION/g" site/motion-detector/*.json site/motion-detector/index.html
          echo "Motion Detector $MD_VERSION"; ls -la site/motion-detector
          echo "Lantern Deck $VERSION"; ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
