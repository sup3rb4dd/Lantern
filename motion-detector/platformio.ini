; Motion Detector: HLK-LD2450 people radar on the ESP32 "Cheap Yellow Display" (ESP32-2432S028R).
; Build with PlatformIO:  pio run            (both versions)
;                         pio run -e cyd -t upload
; Each build also writes a single flashable image, motion-detector-<env>.bin, for the web flasher.

[platformio]
default_envs = cyd, cyd-inverted

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
extra_scripts = post:merge_bin.py
build_flags =
  -DMD_VERSION=\"1.0.0\"
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000

; The common CYD (one micro-USB port)
[env:cyd]

; CYDs whose colors come out inverted (white background), often the ones with two USB ports
[env:cyd-inverted]
build_flags =
  ${env.build_flags}
  -DMD_INVERT=1
